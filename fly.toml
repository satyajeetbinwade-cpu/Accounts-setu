# fly.toml app configuration file generated for accounts-setu-test on 2026-09-26T12:41:27+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'accounts-setu-test'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'
[env]
  PYTHONDONTWRITEBYTECODE = "1"
  PYTHONUNBUFFERED = "1"
  REFLEX_BACKEND_HOST = "0.0.0.0"
  REFLEX_BACKEND_PORT = "8000"
  REFLEX_FRONTEND_PORT = "3000"
  FRONTEND_PORT = "3000"


[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
