        default: 2.0          # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
        individual_huf: 1.0   # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
      single_transaction_threshold: 30000  # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
      annual_aggregate_threshold: 100000   # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
      effective_from: "2024-04-01"         # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing

    "194J":
      description: "Fees for professional / technical services"
      rates:
        technical: 2.0        # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
        professional: 10.0    # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
      single_transaction_threshold: 30000  # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
      annual_aggregate_threshold: 0        # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
      effective_from: "2024-04-01"         # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing

    "194I":
      description: "Rent"
      rates:
        plant_machinery: 2.0  # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
        land_building: 10.0   # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
      single_transaction_threshold: 0      # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
      annual_aggregate_threshold: 240000   # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
      effective_from: "2024-04-01"         # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing

