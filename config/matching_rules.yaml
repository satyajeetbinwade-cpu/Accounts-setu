# ---------------------------------------------------------------------------
# 2C "Other" — Bank, Vendor Ledger, 26AS, Opening Balances, Loan Sheet, Salary
# ---------------------------------------------------------------------------
# The six 2C sources share a generic reference/date/amount identity and are
# layered onto the SAME shared engine validated in sub-phase A (2A/2B) — this
# block is the shared engine's tolerance/key configuration for 2C, not a
# separate engine. Adding a seventh 2C source is a configuration change
# (Module 2's MatchingKeyConfig), not a new code path.
other:
  recon_type: OTHER

  amount_tolerance:
    absolute: 10.0
    percent: 1.0

  rounding_tolerance: 2.0

  date_tolerance_days: 7

  fuzzy_threshold: 80

  confidence_thresholds:
    high: 85
    medium: 55

  confidence_baselines:
    exact: 98
    invoice_variant: 90
    amount_date: 80
    fuzzy_party: 65
    cross_period: 75
    ambiguity_penalty: -8

  # The six 2C sources, each a matching-key configuration on the shared engine.
  sources:
    bank:
      label: "Bank"
      match_keys: ["reference", "date", "amount"]
    vendor_ledger:
      label: "Vendor Ledger"
      match_keys: ["reference", "date", "amount"]
    form26as:
      label: "Form 26AS"
      match_keys: ["reference", "date", "amount"]
    opening_balances:
      label: "Opening Balances"
      match_keys: ["reference", "amount"]
    loan_sheet:
      label: "Loan Sheet"
      match_keys: ["reference", "date", "amount"]
    salary:
      label: "Salary"
      match_keys: ["reference", "date", "amount"]
