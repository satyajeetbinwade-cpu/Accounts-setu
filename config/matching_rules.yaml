# Matching rules config — disposable PoC values.
# A human tunes these by hand during testing. Readability > validation.
# Key convention: "keys" is an ordered list — earlier fields match first
# and carry more weight when scoring.

gst:
  recon_type: GST

  # --- Amount tolerances ---
  # absolute: allowed rupee difference (±Rs).
  # percent:  allowed percentage difference (whole percentage points).
  amount_tolerance:
    absolute: 10.0
    percent: 1.0

  # Rounding tolerance — applied separately from amount_tolerance.
  # Non-zero differences within this threshold are classified as "Rounding"
  # rather than real discrepancies.
  rounding_tolerance: 2.0

  # --- Date tolerance ---
  # Days that two invoice dates may differ and still match.
  date_tolerance_days: 5

  # --- Cross-period matching ---
  # Enable matching against adjacent-period portal files when supplied.
  cross_period_matching: true
  # Confidence penalty for a cross-period (timing difference) match.
  cross_period_penalty: -12

  # --- Fuzzy party name threshold ---
  # 0-100 score. Higher = stricter. Only used with amount + date constraints.
  fuzzy_threshold: 85

  # --- Ambiguity handling ---
  # When the top two candidates' confidence scores are within this margin,
  # force the result to Low confidence.
  ambiguity_margin: 5.0

  # --- Invoice-number normalisation ---
  # Financial-year tokens that a portal export appends to an invoice number
  # ("T11439/26-27", "RL/2915/26-27") but the books export omits ("T11439",
  # "2915"). These are STRIPPED before any matching key is derived, so the
  # trailing-numeric key can never pick the "27" out of the FY suffix.
  # Patterns are Python regexes, applied case-insensitively to the raw value.
  # Kept in config (not code) so a new FY format is a config change.
  invoice_number_fy_patterns:
    - '(?<![0-9])[0-9]{2}-[0-9]{2}(?![0-9])'   # 26-27
    - '(?<![0-9])[0-9]{4}-[0-9]{2}(?![0-9])'   # 2026-27
    - '(?<![0-9])[0-9]{2}/[0-9]{2}(?![0-9])'   # 26/27
    - '(?<![0-9])[0-9]{4}/[0-9]{2}(?![0-9])'   # 2026/27
    - '(?<![0-9])FY[0-9]{2,4}(?![0-9])'        # FY26 / FY2026
    - '(?<![0-9])[0-9]{2}-[0-9]{2}-[0-9]{2}(?![0-9])'  # 26-27-28 (rare)

  # --- Confidence bands ---
  confidence_thresholds:
    high: 92
    medium: 65

  # --- Confidence baselines per pass ---
  # GST keys (GSTIN + invoice number) are strong — baselines sit above TDS.
  confidence_baselines:
    exact: 98             # Pass 1 — GSTIN + normalised invoice number
    invoice_variant: 90   # Pass 1 variant / Pass 2 — same key only after a
                          #   derivation (FY suffix, leading zero, prefix)
    amount_date: 80       # Pass 3 — GSTIN + amount + date window
    fuzzy_party: 65       # Pass 4 — name fuzzy + amount + date
    cross_period: 75      # Pass 5 — re-runs 1-3 against adjacent period
    ambiguity_penalty: -8 # Applied when runner-up is close
    invalid_gstin_penalty: -5  # Distinct deduction when a GSTIN is STRUCTURALLY
                               #   invalid (wrong length — it cannot identify the
                               #   supplier at all). Applied ON TOP of the pass
                               #   baseline so it never coincides with the
                               #   ordinary fuzzy-name-match confidence. A mere
                               #   15-char character TYPO is not this case.
    # NOTE: confidence is pass-based and INDEPENDENT of value agreement — how
    # far the amounts differ drives the Amount Difference classification and
    # review priority, never the certainty of which record matched.

  # --- Document type mappings ---
  # Maps raw document-type values (from GSTR-2B / IMS exports) to normalised
  # types. Values not in this map are classified as "Other".
  document_type_map:
    gstr2b:
      "Invoices": "Invoice"
      "Invoice": "Invoice"
      "B2B": "Invoice"
      "Credit Notes": "Credit Note"
      "Credit Note": "Credit Note"
      "CDN": "Credit Note"
      "Debit Notes": "Debit Note"
      "Debit Note": "Debit Note"
      "Amendments": "Amendment"
      "Amendment": "Amendment"
      "ISD Credits": "ISD"
      "ISD": "ISD"
      "Import of Goods": "Import"
      "Import of Services": "Import"
      "Reverse Charge": "Reverse Charge"
      "RCM": "Reverse Charge"
    ims:
      "Invoice": "Invoice"
      "Credit Note": "Credit Note"
      "Debit Note": "Debit Note"
      "Amendment": "Amendment"

  # --- Valid GST rate slabs (%) ---
  # Used for rate-mismatch detection. If the effective rate implied by a
  # record does not correspond to any listed slab, it is flagged.
  # UNVERIFIED — confirm against current GST law before accuracy testing
  valid_rate_slabs:
    - 0.0     # UNVERIFIED — confirm against current GST law before accuracy testing
    - 0.1     # UNVERIFIED — confirm against current GST law before accuracy testing
    - 0.25    # UNVERIFIED — confirm against current GST law before accuracy testing
    - 1.5     # UNVERIFIED — confirm against current GST law before accuracy testing
    - 3.0     # UNVERIFIED — confirm against current GST law before accuracy testing
    - 5.0     # UNVERIFIED — confirm against current GST law before accuracy testing
    - 6.0     # UNVERIFIED — confirm against current GST law before accuracy testing
    - 7.5     # UNVERIFIED — confirm against current GST law before accuracy testing
    - 12.0    # UNVERIFIED — confirm against current GST law before accuracy testing
    - 18.0    # UNVERIFIED — confirm against current GST law before accuracy testing
    - 28.0    # UNVERIFIED — confirm against current GST law before accuracy testing


tds:
  recon_type: TDS

  # --- Matching tolerances ---

  # Amount comparison tolerance for TDS amount matching.
  # absolute: allowed rupee difference (e.g. 10.0 means ±Rs 10).
  # percent:  allowed percentage difference (1.0 means ±1%).
  amount_tolerance:
    absolute: 10.0
    percent: 1.0

  # Rounding tolerance — applied separately from amount_tolerance.
  # TDS computations constantly produce ±1–2 rupee rounding differences.
  # Differences within this tolerance are classified as "Rounding", not
  # real amount discrepancies.
  rounding_tolerance: 2.0

  # Date tolerance for deduction / deposit date comparison.
  date_tolerance_days: 7

  # Whether to attempt matching across adjacent quarter boundaries.
  # true = cross-quarter matching is enabled in Pass 3 (deductee) / treated
  #        as a timing difference, not a mismatch.
  quarter_boundary_matching: true

  # Fuzzy match threshold (0-100) for deductee/deductor name matching.
  # Higher = stricter. Used only in combination with section + amount.
  fuzzy_threshold: 80

  # Confidence bands — score >= high → "High", >= medium → "Medium", else "Low".
  confidence_thresholds:
    high: 85
    medium: 55

  # Confidence baselines per matching pass. TDS baselines sit below GST
  # equivalents because TDS keys are structurally weaker (no invoice number).
  confidence_baselines:
    challan: 92        # Pass 1 — strongest available key
    deductee_level: 78 # Pass 2 — PAN + section + amount + date
    aggregated: 68     # Pass 3 — group match; further reduced by group size
    fuzzy: 55          # Pass 4 — name-based; weakest signal
    cross_quarter: -10 # Penalty applied on top of the pass baseline
    section_validation: 80  # Books-internal rate/threshold checks

  # Per additional record in an aggregated group, deduct this many points
  # from the aggregated baseline (larger groups = lower confidence).
  aggregated_group_size_penalty: 2

  # TDS rate that applies when PAN is missing or structurally invalid.
  # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
  no_pan_rate: 20.0

  # --- TDS section rate table ---
  # Each entry: rate (%), rate_variants (if applicable), single_transaction_threshold,
  # annual_aggregate_threshold, effective_from date.
  #
  # ALL rates and thresholds below are PLACEHOLDERS.
