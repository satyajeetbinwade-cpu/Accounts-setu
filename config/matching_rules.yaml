      single_transaction_threshold: 30000  # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
      annual_aggregate_threshold: 0        # UNVERIFIED — must be confirmed against current Finance Act by firm before any accuracy testing
